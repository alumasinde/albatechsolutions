; Production OPcache profile for AlbaTech Solutions.
; Install on the server (outside the web root), e.g. copy to the PHP conf.d directory
; or set equivalents in the PHP-FPM pool.

opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000

; File-change polling off: every request skips stat() checks on ~200 PHP files.
; REQUIRED: after each deployment changed files are only picked up when PHP is
; reloaded (php-fpm: "systemctl reload php-fpm", or call opcache_reset() from a
; deploy hook). Forgetting the reload serves the previous release.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Optional: persist compiled PHP on disk so OPcache warms instantly after a reload.
; Enable only when the PHP process user can write the path.
;opcache.file_cache=/var/run/php-opcache-albatech
;opcache.file_cache_only=0
