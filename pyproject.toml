[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "google-photo-transfer"
version = "0.1.0"
description = "Transfer Google Photos Takeout media to another Google account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
  "tqdm>=4.67,<5",
  "Pillow>=11,<12",
]

[project.scripts]
photo-transfer = "photo_transfer.cli:main"

[tool.setuptools.packages.find]
include = ["photo_transfer*"]
